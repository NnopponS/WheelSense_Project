; PlatformIO Project Configuration for WheelSense M5StickCPlus2 BLE Gateway
; BLE peripheral gateway + IMU telemetry

[env:m5stick-c-plus2]
platform = espressif32 @ ^6.5.0
board = m5stick-c
framework = arduino
monitor_speed = 115200

board_build.partitions = huge_app.csv
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_USB_MODE=1
    -DUSER_SETUP_LOADED
    -DST7789_DRIVER
    -DTFT_WIDTH=135
    -DTFT_HEIGHT=240
    -DTFT_MOSI=15
    -DTFT_SCLK=13
    -DTFT_CS=5
    -DTFT_DC=14
    -DTFT_RST=12
    -DTFT_BL=27
    -DTFT_BACKLIGHT_ON=HIGH
    -DLOAD_GLCD
    -DSPI_FREQUENCY=27000000

lib_deps =
    bblanchon/ArduinoJson @ ^6.21.0
    bodmer/TFT_eSPI @ ^2.5.43
    lewisxhe/AXP202x_Library @ ^1.1.2

lib_ignore =
    DFRobot_GP8XXX

build_src_filter =
    +<main.cpp>
    -<managers/APPortalManager.cpp>
    -<managers/BLEManager.cpp>
    -<managers/BuzzerManager.cpp>
    -<managers/ConfigManager.cpp>
    -<managers/InputManager.cpp>
    -<managers/NetworkManager.cpp>
    -<managers/SensorManager.cpp>
    -<ui/>
