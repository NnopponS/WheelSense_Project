# Cloudflare quick tunnel → Next.js (`wheelsense-platform-web:3000`) + MQTT publish of `portal_base_url`
# to `WheelSense/config/all`.
#
# **Production (`docker-compose.yml`):** this file is included automatically — `cf-tunnel-publish` starts on every
# `docker compose up` (no extra flags).
#
# **Simulator:** not included in `docker-compose.sim.yml`. From `server/` run:
#   docker compose -f docker-compose.sim.yml -f docker-compose.cf-tunnel.yml up -d --build
#
# ARM64: `docker compose build --build-arg TARGETARCH=arm64 cf-tunnel-publish`

services:
  cf-tunnel-publish:
    build:
      context: .
      dockerfile: docker/cf-tunnel-publish/Dockerfile
    restart: unless-stopped
    # Inherit MQTT_BROKER (and other vars) from the same .env the app uses, so the
    # tunnel can never publish portal_base_url to a different broker than the app
    # and mobile clients. Without this the environment default below (mosquitto)
    # silently diverged from the app's broker.emqx.io, so the retained
    # WheelSense/config/all message landed on the wrong broker.
    env_file:
      - .env
    environment:
      TUNNEL_TARGET_URL: ${CF_TUNNEL_TARGET_URL:-http://wheelsense-platform-web:3000}
      TUNNEL_PROTOCOL: ${CF_TUNNEL_PROTOCOL:-http2}
      TUNNEL_EDGE_IP_VERSION: ${CF_TUNNEL_EDGE_IP_VERSION:-4}
      TUNNEL_RESTART_AFTER_EDGE_LOSS_SECONDS: ${CF_TUNNEL_RESTART_AFTER_EDGE_LOSS_SECONDS:-14}
      TUNNEL_RESTART_BACKOFF_SECONDS: ${CF_TUNNEL_RESTART_BACKOFF_SECONDS:-6}
      # MQTT_BROKER intentionally NOT set here — it comes from env_file (.env) so it
      # always matches the server app. run.py falls back to localhost if unset.
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USER: ${MQTT_USER:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
    depends_on:
      wheelsense-platform-web:
        condition: service_started
      mosquitto:
        condition: service_healthy
