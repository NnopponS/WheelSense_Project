<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 252 208">
  <!-- Leather belt strap -->
  <rect x="0" y="72" width="252" height="64" rx="10" fill="#6b4f35"/>
  <rect x="0" y="80" width="252" height="2.5" fill="#8a6b4a"/>
  <rect x="0" y="126" width="252" height="2.5" fill="#8a6b4a"/>
  <!-- Stitching -->
  <line x1="8" y1="86" x2="244" y2="86" stroke="#d9c4a5" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
  <line x1="8" y1="122" x2="244" y2="122" stroke="#d9c4a5" stroke-width="2" stroke-dasharray="7 6" stroke-linecap="round"/>
  <!-- Belt holes -->
  <circle cx="228" cy="104" r="4" fill="#3f2d1d"/>
  <circle cx="212" cy="104" r="4" fill="#3f2d1d"/>
  <circle cx="196" cy="104" r="4" fill="#3f2d1d"/>
  <!-- Clip behind device -->
  <rect x="88" y="60" width="76" height="10" rx="4" fill="#2e2e2e"/>
  <rect x="96" y="140" width="60" height="12" rx="5" fill="#2e2e2e"/>
  <!-- M5StickC Plus2 body -->
  <rect x="82" y="34" width="88" height="140" rx="14" fill="#16181d"/>
  <rect x="82" y="34" width="88" height="140" rx="14" fill="none" stroke="#3a3f4b" stroke-width="2"/>
  <!-- Screen -->
  <rect x="92" y="46" width="68" height="88" rx="6" fill="#10141f"/>
  <!-- ECG / fall line on screen -->
  <polyline points="98,96 110,96 116,78 122,112 128,88 134,96 154,96" fill="none" stroke="#e8463c" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>
  <!-- Alert triangle -->
  <polygon points="104,60 112,74 96,74" fill="#f6b73c"/>
  <rect x="103.2" y="64.5" width="1.8" height="5" fill="#1a1a1a"/>
  <circle cx="104.1" cy="72" r="1.1" fill="#1a1a1a"/>
  <!-- Screen label -->
  <text x="126" y="124" font-family="Arial, sans-serif" font-size="9" fill="#8fb8ff" text-anchor="middle" letter-spacing="0.5">FallGuard</text>
  <!-- Power button -->
  <rect x="166" y="58" width="6" height="18" rx="3" fill="#3a3f4b"/>
  <!-- Button A -->
  <circle cx="126" cy="152" r="9" fill="#2c313c" stroke="#454b58" stroke-width="1.5"/>
  <text x="126" y="156" font-family="Arial, sans-serif" font-size="8" fill="#c9cfdb" text-anchor="middle">M5</text>
  <!-- Groves port -->
  <rect x="102" y="170" width="48" height="8" rx="2" fill="#3a3f4b"/>
  <!-- FallGuard tag -->
  <rect x="78" y="186" width="96" height="18" rx="9" fill="#e8463c"/>
  <text x="126" y="199" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">FALLGUARD BELT</text>
</svg>
