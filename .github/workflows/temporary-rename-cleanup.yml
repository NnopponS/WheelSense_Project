name: Temporary rename cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-rename-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'NnopponS/WheelSense_Project'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete old branch names
        run: |
          set -euo pipefail
          git push origin --delete archive/model-mockup || true
          git push origin --delete demo-mockup || true

      - name: Remove temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/temporary-rename-cleanup.yml
          git commit -m "chore: remove temporary rename cleanup workflow"
          git push origin HEAD:main
