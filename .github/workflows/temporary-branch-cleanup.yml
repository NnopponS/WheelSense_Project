name: Temporary branch cleanup

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/temporary-branch-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'NnopponS/WheelSense_Project'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Delete branches outside the approved allowlist
        env:
          DELETE_BRANCHES: |
            chore/dependabot-batch
            codex/demo-physical-model-overlay
            codex/game-mobile-demo-additions
            demo/codex-combined
            dependabot/github_actions/actions/cache-6
            dependabot/github_actions/actions/checkout-7
            dependabot/github_actions/actions/dependency-review-action-5
            dependabot/github_actions/actions/setup-node-7
            dependabot/github_actions/actions/setup-python-7
            dependabot/npm_and_yarn/e2e/mqtt-5.15.2
            dependabot/npm_and_yarn/e2e/playwright/test-1.62.1
            dependabot/npm_and_yarn/e2e/types/node-26.1.2
            dependabot/npm_and_yarn/frontend/date-fns-4.4.0
            dependabot/npm_and_yarn/frontend/eslint-10.5.0
            dependabot/npm_and_yarn/frontend/hookform/resolvers-5.4.0
            dependabot/npm_and_yarn/frontend/jest-environment-jsdom-30.4.1
            dependabot/npm_and_yarn/frontend/radix-ui/react-separator-1.1.10
            dependabot/npm_and_yarn/frontend/radix-ui/react-slot-1.3.0
            dependabot/npm_and_yarn/frontend/react-dom-19.2.7
            dependabot/npm_and_yarn/frontend/tailwind-merge-3.6.0
            dependabot/npm_and_yarn/frontend/tiptap/extension-link-3.27.1
            dependabot/npm_and_yarn/frontend/types/node-26.0.0
            dependabot/pip/server/aiosqlite-gte-0.22.1
            dependabot/pip/server/fastapi-0.138.0
            dependabot/pip/server/mcp-gte-1.28.0
            dependabot/pip/server/pydantic-gte-2.13.4
            dependabot/pip/server/pytest-asyncio-gte-1.4.0
            dependabot/pip/server/requests-gte-2.34.2
            dependabot/pip/server/sentence-transformers-gte-5.6.0
            dependabot/pip/server/sqlalchemy-2.0.51
            dependabot/pip/server/uvicorn-gte-0.49.0
            dependabot/pip/server/xgboost-gte-3.3.0
            docs/readme-professionalize
            docs/wiki-clean-file-protocol-links
        run: |
          set -euo pipefail
          failed=0

          while IFS= read -r branch; do
            [ -z "$branch" ] && continue

            case "$branch" in
              main|demo-mockup|release/wheelsense-v1|release/wheelsense-v2|prototype-v1|prototype-v2|prototype-v3|archive/prototype-wheelsense|archive/model-mockup)
                echo "::error::Refusing to delete allowlisted branch: $branch"
                failed=1
                continue
                ;;
            esac

            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              echo "Deleting branch: $branch"
              if ! git push origin --delete "$branch"; then
                echo "::error::Failed to delete branch: $branch"
                failed=1
              fi
            else
              echo "Already absent: $branch"
            fi
          done <<< "$DELETE_BRANCHES"

          if [ "$failed" -ne 0 ]; then
            exit 1
          fi

      - name: Remove this temporary workflow
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -- .github/workflows/temporary-branch-cleanup.yml
          git commit -m "chore: remove temporary branch cleanup workflow"
          git push origin HEAD:main
